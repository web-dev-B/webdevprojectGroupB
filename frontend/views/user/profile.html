<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile</title>
  <link rel="shortcut icon" type="image/x-icon" href="../../assets/images/logoRecipe.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/indexstyle.css">
</head>
<body>
  <!-- nav -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
      <a class="navbar-brand" href="#">FoodHub</a>
      <div class="d-flex align-items-center ms-auto order-lg-2 dropdown-auth-links">
        <i class="bi bi-person-fill" id="login_user"></i>
        <a href="../../views/home/index.html" class="logout-button">Log out</a>
      </div>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link active" href="login_home.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Meals</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Diet</a>
          </li>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="createRecipe.html">Create</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="posts.html">My posts</a>
          </li>
        </ul>
        <form class="d-flex">
          <input class="form-control me-2" type="search" placeholder="Search recipes..." aria-label="Search">
          <button class="btn btn-outline-success" type="submit">Search</button>
        </form>
      </div>
    </div>
  </nav>

  <!-- profile section (we can edit later) -->
  <section class="container mt-5">
    <div class="row">
      <div class="col-md-4">
        <div class="card">
          <img src="/path/to/profile-picture.jpg" class="card-img-top" alt="Profile Picture">
          <div class="card-body">
            <h5 class="card-title" id="name">Name:</h5>
            <p class="card-text">Email</p>
            <p class="card-text">Following: <span id="following-count">0</span> users</p>
          </div>
        </div>
      </div>
      <div class="col-md-8">
        <!-- more stuff in profile can be added-->
      </div>
    </div>
  </section>

  <script src="/js/auth.js"></script>
  <script src="/js/home.js"></script>
  <script src="/js/navigate.js"></script>
  <script src="/js/profile.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
