<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Post</title>
    <link rel="shortcut icon" type="image/x-icon" href="../../assets/images/logoWeb.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Add font Inknut Antiqua-->
    <link href="https://fonts.googleapis.com/css2?family=Inknut+Antiqua:wght@400;700&display=swap" rel="stylesheet">
    <link href="../../public/css/pages/createRecipe.css" rel="stylesheet">
</head>
<body>
    

    <div class="container">
        <h1 class="text-center mb-4">CREATE NEW POST</h1>
        <div class="row">
            <div class="col-md-6">
                <h3 class="section-title">BASIC INFO</h3>
                <form>
                    <div class="mb-3">
                        <label for="recipeName" class="form-label">Recipe name</label>
                        <input type="text" class="form-control" id="recipeName" placeholder="Name...">
                    </div>
                    <div class="row mb-3">
                        <div class="col">
                            <label for="serves" class="form-label">SERVES</label>
                            <input type="text" class="form-control" id="serves" placeholder="...">
                        </div>
                        <div class="col">
                            <label for="prep" class="form-label">PREP</label>
                            <input type="text" class="form-control" id="prep" placeholder="...">
                        </div>
                        <div class="col">
                            <label for="cook" class="form-label">COOK</label>
                            <input type="text" class="form-control" id="cook" placeholder="...">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="imageUpload" class="form-label">Upload an image</label>
                        <input type="file" class="form-control" id="imageUpload">
                    </div>
                    <div class="mb-3">
                        <div class="mb-3">
                            <label for="ingredients" class="form-label">Ingredients</label>
                            <input type="text" class="form-control" id="ingredientInput" placeholder="Type an ingredient...">
                            <div id="suggestions" class="list-group mt-2"></div>
                            <div id="selectedIngredients" class="mt-3">
                                <!-- Selected ingredients will appear here as tags -->
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="col-md-6">
                <h3 class="section-title">HOW-TO</h3>
                <div class="mb-3">
                    <textarea class="form-control" id="instructions" rows="10" placeholder="Instructions..."></textarea>
                </div>
            </div>
        </div>
        <div class="text-center mt-4">
            <button type="submit" class="btn btn-custom px-4">Create</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Add ingredients -->
    <script>
        const availableIngredients = ["Onion", "Butter", "Garlic", "Tomato", "Salt", "Pepper", "Cheese", "Chicken"];
        const ingredientInput = document.getElementById("ingredientInput");
        const suggestions = document.getElementById("suggestions");
        const selectedIngredients = document.getElementById("selectedIngredients");
        const addedIngredients = new Set();

        ingredientInput.addEventListener("input", () => {
            const query = ingredientInput.value.toLowerCase();
            suggestions.innerHTML = "";
            if (query) {
                const matches = availableIngredients.filter(ingredient => 
                    ingredient.toLowerCase().includes(query) && !addedIngredients.has(ingredient)
                );
                matches.forEach(match => {
                    const suggestionItem = document.createElement("button");
                    suggestionItem.className = "list-group-item list-group-item-action";
                    suggestionItem.textContent = match;
                    suggestionItem.addEventListener("click", () => {
                        addIngredientTag(match);
                        ingredientInput.value = "";
                        suggestions.innerHTML = "";
                    });
                    suggestions.appendChild(suggestionItem);
                });
            }
        });

        function addIngredientTag(ingredient) {
            if (!addedIngredients.has(ingredient)) {
                addedIngredients.add(ingredient);
                const tag = document.createElement("span");
                tag.className = "badge bg-secondary me-2";
                tag.textContent = ingredient;
                const removeBtn = document.createElement("button");
                removeBtn.className = "btn-close btn-close-white ms-2";
                removeBtn.style.fontSize = "0.6rem";
                removeBtn.addEventListener("click", () => {
                    tag.remove();
                    addedIngredients.delete(ingredient);
                });
                tag.appendChild(removeBtn);
                selectedIngredients.appendChild(tag);
            }
        }
    </script>
</body>
</html>
