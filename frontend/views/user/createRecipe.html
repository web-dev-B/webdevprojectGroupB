    <div class="container">

    <h1><strong>CREATE NEW POST</strong></h1>
    
    <form id="recipeForm">
      <div class="form-layout">
        <div class="form-column">
          <h2>BASIC INFO</h2>
          
          <div class="input-row">
            <div class="form-group">
              <label for="recipeName">Recipe name</label>
              <input type="text" id="recipeName" placeholder="Name...">

            </div>
  
            <div class="form-group">
              <label for="recipeName">Type</label>
              <input type="text" id="type" placeholder="Type...">
            </div>
          </div>

          <div class="input-row">
            <div class="form-group">
              <label for="serves">SERVES</label>
              <input type="text" id="serves" placeholder="...">
            </div>
            
            <div class="form-group">
              <label for="prepTime">PREP</label>
              <input type="text" id="prepTime" placeholder="...">
            </div>
            
            <div class="form-group">
              <label for="cookTime">COOK</label>
              <input type="text" id="cookTime" placeholder="...">
            </div>
          </div>
          
          <div class="form-group upload-container">
            <label>Upload an image</label>
            <input type="file" id="recipeImage" name="image">
          </div>
          
          <div class="form-group">
            <label>Ingredients</label>
            <div class="ingredient-input">
              <div class="autocomplete-container">
                <input type="text" id="ingredientInput" placeholder="Type an ingredient...">
                <div class="autocomplete-results" id="autocompleteResults"></div>
              </div>
              <button type="button" id="addIngredient">Add</button>
            </div>
            <div class="tags-container" id="ingredientTags"></div>
            <div class="ingredients-list" id="ingredientsList"></div>
          </div>
        </div>
        
        <div class="form-column">
          <h2>HOW-TO</h2>
          <div class="form-group">
            <textarea id="instructions" placeholder="Instructions..."></textarea>
          </div>
        </div>
      </div>
      
      <button type="submit" class="create-btn">Create</button>
    </form>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/createRecipe.js"></script>
  <script src="/js/navigate.js"></script>
