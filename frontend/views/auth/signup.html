<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup - GroupB food web</title>
  <link rel="stylesheet" href="/frontend/public/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <div class="logo">GroupB food web</div>
      <ul class="nav-links">
        <li><a href="/frontend/views/home/index.html">Home</a></li>
        <li><a href="/frontend/views/auth/login.html">Login</a></li>
        <li><a href="/frontend/views/auth/signup.html">Signup</a></li>
      </ul>
    </div>
  </nav>

  <section class="auth-container">
    <div class="container">
      <div class="auth-card">
        <h2>Signup to share your recipes!</h2>
        <form id="signupForm">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
          </div>
          
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>
          
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
          </div>
          
          <button type="submit" class="btn primary">Signup</button>
        </form>
        <p>Already have an account? <a href="/frontend/views/auth/login.html">Login here</a></p>
      </div>
    </div>
  </section>

  <script src="/frontend/public/js/auth.js"></script>
</body>
</html>
