<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>groupB webproject</title>
  <link rel="stylesheet" href="/frontend/public/css/indexstyle.css">
</head>
<body>
  <header>
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">Meals</a>
      <a href="#">Diet</a>
    </div>
    <div class="auth-links">
      <a href="../auth/login.html" class="auth-button">Log in</a>
      <a href="../auth/signup.html" class="auth-button">Sign in</a>
    </div>
  </header>

  <main>
    <section class="section most-search">
      <h2>MOST SEARCH</h2>
      <div class="search-categories">
        <div class="category">these will become category filters</div>
      </div>
      
      <div class="search-container">
        <div class="search-bar">
          <input type="text" placeholder="Tasty recipes...">
          <button>Search</button>
        </div>
      </div>
    </section>

    <section class="section recipe-of-day-section">
      <h2>RECIPE OF THE DAY</h2>
      <div class="recipe-of-day-placeholder">
        Recipe of the Day will be added here
      </div>
    </section>

    <section class="section explore-more">
      <h2>EXPLORE MORE</h2>
      <div class="recipe-grid">
        <!-- recipe placeholders -->
        <div class="recipe-card-placeholder">
          <div class="recipe-card-placeholder-category">Dessert</div>
          <div class="recipe-card-placeholder-content">
            <h3>Recipe 1 will be added here</h3>
          </div>
        </div>
      
        <div class="recipe-card-placeholder">
          <div class="recipe-card-placeholder-category">Appetizer</div>
          <div class="recipe-card-placeholder-content">
            <h3>Recipe 2 will be added here</h3>
          </div>
        </div>
        
        <div class="recipe-card-placeholder">
          <div class="recipe-card-placeholder-category">Sauce</div>
          <div class="recipe-card-placeholder-content">
            <h3>Recipe 3 will be added here</h3>
          </div>
        </div>
        
      </div>
    </section>
  </main>
</body>
</html>
