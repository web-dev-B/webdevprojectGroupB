<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodHub</title>
  <link rel="shortcut icon" type="image/x-icon" href="../../assets/images/logoRecipe.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/indexstyle.css">
</head>
<body>
  <!-- Navigation Bar with Search -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
      <a class="navbar-brand" href="#">FoodHub</a>
      <div class="d-flex align-items-center ms-auto order-lg-2 dropdown-auth-links">
        <i class="bi bi-person-fill" id="user"></i>
        <div class="auth-links">
          <a href="/auth/login.html" class="login-button">Log in</a>
          <a href="/auth/signup.html" class="signin-button">Sign in</a>
        </div>
      </div>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link active" href="#">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/home/meals.html">Meals</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/home/diet.html">Diet</a>
          </li>
        </ul>
        <form class="d-flex">
          <input class="form-control me-2" type="search" placeholder="Search recipes..." aria-label="Search">
          <button class="btn btn-outline-success" type="submit">Search</button>
        </form>
      </div>
    </div>
  </nav>

  <main>
    <div class="container py-5">
      <div class="row justify-content-center">
          <div class="col-md-8 text-center">
              <h1 class="mb-5 fw-bold">MOST SEARCH</h1>
              
              <div class="mb-4">
                  <div class="d-flex flex-wrap justify-content-center gap-2 mb-3">
                      <button class="btn btn-light rounded-pill px-3">Bread</button>
                      <button class="btn btn-light rounded-pill px-3">Salmon</button>
                      <button class="btn btn-light rounded-pill px-3">Cocktails</button>
                      <button class="btn btn-light rounded-pill px-3">Breakfast</button>
                      <button class="btn btn-light rounded-pill px-3">Rice</button>
                  </div>
                  
                  <div class="d-flex flex-wrap justify-content-center gap-2">
                      <button class="btn btn-light rounded-pill px-3">Snacks</button>
                      <button class="btn btn-light rounded-pill px-3">Appetizers</button>
                      <button class="btn btn-light rounded-pill px-3">Casseroles</button>
                      <button class="btn btn-light rounded-pill px-3">Sauces</button>
                      <button class="btn btn-light rounded-pill px-3">Eggs</button>
                  </div>
              </div>
              
              <div class="input-group mb-3">
                  <span class="input-group-text bg-white border-end-0">
                      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                          <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
                      </svg>
                  </span>
                  <input type="text" class="form-control border-start-0" placeholder="Tasty recipes...">
                  <button class="btn" style="background-color: #e6d7b7;">Search</button>
              </div>
          </div>
      </div>
  </div>

    <section class="section recipe-of-day-section">
      <h2>RECIPE OF THE DAY</h2>
      <div class="recipe-of-day-placeholder">
        Recipe of the Day will be added here
      </div>
    </section>

    <section class="section explore-more">
      <h2>EXPLORE MORE</h2>
      <div class="recipe-grid">
        <!-- recipe placeholders -->
        <div class="recipe-card-placeholder">
          <div class="recipe-card-placeholder-category">Dessert</div>
          <div class="recipe-card-placeholder-content">
            <h3>Recipe 1 will be added here</h3>
          </div>
        </div>
      
        <div class="recipe-card-placeholder">
          <div class="recipe-card-placeholder-category">Appetizer</div>
          <div class="recipe-card-placeholder-content">
            <h3>Recipe 2 will be added here</h3>
          </div>
        </div>
        
        <div class="recipe-card-placeholder">
          <div class="recipe-card-placeholder-category">Sauce</div>
          <div class="recipe-card-placeholder-content">
            <h3>Recipe 3 will be added here</h3>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="/js/home.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navigate.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
