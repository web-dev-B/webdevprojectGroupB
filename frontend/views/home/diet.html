<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>groupB webproject</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">
  <link rel="stylesheet" href="../../public/css/indexstyle.css">
</head>
<body>
  <!-- Navigation Bar with Search -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
      <a class="navbar-brand" href="#">LOGO</a>
      <div class="d-flex align-items-center ms-auto order-lg-2 dropdown-auth-links">
        <i class="bi bi-person-fill" id="user"></i>
        <div class="auth-links">
          <a href="../auth/login.html" class="login-button">Log in</a>
          <a href="../auth/signup.html" class="signin-button">Sign in</a>
        </div>
      </div>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link active" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="meals.html">Meals</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="diet.html">Diet</a>
          </li>
        </ul>
        <form class="d-flex">
          <input class="form-control me-2" type="search" placeholder="Search recipes..." aria-label="Search">
          <button class="btn btn-outline-success" type="submit">Search</button>
        </form>
      </div>
    </div>
  </nav>

  <main>
    <section class="section most-popular">
      <h2>FOR YOUR DIET</h2>
      <div class="search-categories">
        <div class="category">these will become category filters</div>
      </div>
    </section>

    <section class="section recipe-of-day-section">
      <h2>RECIPE OF THE DAY</h2>
      <div class="recipe-of-day-placeholder">
        Recipe of the Day will be added here
      </div>
    </section>

    <section class="section explore-more">
      <h2>EXPLORE MORE</h2>
      <div class="recipe-grid">
        <!-- recipe placeholders -->
        <div class="recipe-card-placeholder">
          <div class="recipe-card-placeholder-category">Dessert</div>
          <div class="recipe-card-placeholder-content">
            <h3>Recipe 1 will be added here</h3>
          </div>
        </div>
      
        <div class="recipe-card-placeholder">
          <div class="recipe-card-placeholder-category">Appetizer</div>
          <div class="recipe-card-placeholder-content">
            <h3>Recipe 2 will be added here</h3>
          </div>
        </div>
        
        <div class="recipe-card-placeholder">
          <div class="recipe-card-placeholder-category">Sauce</div>
          <div class="recipe-card-placeholder-content">
            <h3>Recipe 3 will be added here</h3>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="/frontend/public/js/home.js"></script>
  <script src="/frontend/public/js/auth.js"></script>
  <script src="/frontend/public/js/navigate.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
